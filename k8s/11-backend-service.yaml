# type: LoadBalancer here provisions a public AWS Network Load Balancer via
# the AWS Load Balancer Controller (annotation below) -- gives a stable
# *.elb.amazonaws.com hostname without needing a custom domain or ACM cert.
# Fine for this PoC's HTTP-only, no-domain-yet deployment path; swap back to
# ClusterIP + k8s/30-ingress.yaml once a real domain/TLS is set up.
# External port is 80 (not the backend's actual 8000) because some client
# networks only allow outbound traffic on standard ports (80/443) -- port is
# just a listener/target mapping, the pod itself still runs on 8000.
apiVersion: v1
kind: Service
metadata:
  name: km-backend
  namespace: km-agent
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: km-backend
  ports:
    - port: 80
      targetPort: 8000
