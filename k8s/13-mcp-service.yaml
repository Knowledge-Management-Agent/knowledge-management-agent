# ClusterIP only -- deliberately not internet-facing (see
# k8s/12-mcp-deployment.yaml). Reach it with:
#   kubectl -n km-agent port-forward svc/km-mcp 8001:8001
# then point an SSE-capable MCP client at http://localhost:8001/sse.
apiVersion: v1
kind: Service
metadata:
  name: km-mcp
  namespace: km-agent
spec:
  type: ClusterIP
  selector:
    app: km-mcp
  ports:
    - port: 8001
      targetPort: 8001
