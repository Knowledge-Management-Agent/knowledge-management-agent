# Stateless -- safe to run multiple replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: km-frontend
  namespace: km-agent
  labels:
    app: km-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: km-frontend
  template:
    metadata:
      labels:
        app: km-frontend
    spec:
      containers:
        - name: frontend
          image: REPLACE_WITH_ECR_URI/km-agent-frontend:REPLACE_WITH_TAG
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
